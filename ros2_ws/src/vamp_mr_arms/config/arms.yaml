# Everything about this cell that is a choice rather than a measurement.
#
# The arms and the obstacles are NOT here -- they live in cell.yaml, which
# tools/mjcf_to_scene.py generates from models/bimanual_scene.xml. Edit the MuJoCo scene and
# re-run tools/make_env.sh to change the cell; edit this file to change the motion.

env_json: two_arms.json

# End-effector target per arm, in the world frame. The frame being positioned is `tcp`, the
# 2F85's pinch point -- so a target is where the grasp happens, not where the gripper's
# mounting flange goes.
#
# The cell, for reference (measured off the generated cell.yaml):
#   arms bolted at z = 0.8637, left at x = +0.22, right at x = -0.26, both facing +y
#   workbench top 0.8635    work table top 0.750    conveyor belt top 0.705
#   left_bin  (+0.20, 1.00)   floor 0.770  rim 0.830   blocks up to 0.800
#   right_bin (-0.30, 1.00)   floor 0.770  rim 0.830
#   conveyor_bin (0.00, 0.58) floor 0.725  rim 0.785
#
# These are a starting point, not a validated routine: they have not been run against the
# planner yet, because the UR5e collision kernel needs cricket to exist first. Check them
# with teach.launch.py, which refuses to record a pose the planner cannot use.
routine:
  - {name: home,        left: [0.22, 0.45, 1.15],  right: [-0.26, 0.45, 1.15]}
  - {name: over_bins,   left: [0.20, 0.95, 1.00],  right: [-0.30, 0.95, 1.00]}
  - {name: at_bins,     left: [0.20, 0.95, 0.88],  right: [-0.30, 0.95, 0.88]}
  - {name: lift,        left: [0.20, 0.95, 1.05],  right: [-0.30, 0.95, 1.05]}
  - {name: over_drop,   left: [0.10, 0.58, 1.00],  right: [-0.14, 0.58, 1.00]}
  - {name: drop,        left: [0.06, 0.58, 0.85],  right: [-0.10, 0.58, 0.85]}
  - {name: retreat,     left: [0.22, 0.45, 1.15],  right: [-0.26, 0.45, 1.15]}

# reference is both the first IK seed and the source of the tool-down orientation every
# routine target is solved with.
ik:
  reference: [0.0, -1.57, 1.57, -1.57, -1.57, 0.0]
  max_restarts: 60
  tol_pos: 0.01
  tol_ang: 0.15

planning:
  planner: composite_rrt      # composite_rrt | cbs_prm | priority_sipp_rrt
  planning_time: 10.0         # s, per leg
  shortcut_time: 0.1          # s, per leg
  vmax: 1.0                   # rad/s
  dt: 0.001                   # s between trajectory samples
  seed: 3
  roadmap_samples: 1500       # cbs_prm only
  roadmap_max_dist: 2.0       # cbs_prm only

replay:
  rate: 1.0
  loop: true
