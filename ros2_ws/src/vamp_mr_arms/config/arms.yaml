env_json: two_arms.json

# Both arms are planned as VAMP's UR5 model, which stands on a 0.9144 m pedestal and is
# yawed 1.57 rad. base.xyz is the foot of that pedestal, so base_link lands 0.9144 m up.
arms:
  - name: ur5
    ur_type: ur5
    base: {xyz: [-0.35, -0.25, 0.0], rpy: [0.0, 0.0, 0.0]}
    ee_frame: tool0
    joints: [shoulder_pan_joint, shoulder_lift_joint, elbow_joint,
             wrist_1_joint, wrist_2_joint, wrist_3_joint]
  - name: ur7e
    ur_type: ur7e
    base: {xyz: [0.35, -0.25, 0.0], rpy: [0.0, 0.0, 0.0]}
    ee_frame: tool0
    joints: [shoulder_pan_joint, shoulder_lift_joint, elbow_joint,
             wrist_1_joint, wrist_2_joint, wrist_3_joint]

# Collision geometry the planner checks. z is the centre of the box.
# The work table top is at 0.83 m: the UR5 model's base sphere (r = 0.08 at base_link,
# z = 0.9144) reaches down to 0.8344, so a higher top collides at every pose.
scene:
  - {name: work_table_top,        role: table,    size: [1.50, 0.80, 0.05], xyz: [0.00, -0.25, 0.805]}
  - {name: work_table_leg_fl,     role: table,    size: [0.07, 0.07, 0.78], xyz: [-0.68, 0.08, 0.39]}
  - {name: work_table_leg_fr,     role: table,    size: [0.07, 0.07, 0.78], xyz: [0.68, 0.08, 0.39]}
  - {name: work_table_leg_bl,     role: table,    size: [0.07, 0.07, 0.78], xyz: [-0.68, -0.58, 0.39]}
  - {name: work_table_leg_br,     role: table,    size: [0.07, 0.07, 0.78], xyz: [0.68, -0.58, 0.39]}
  # conveyor_belt's y keeps its near edge (0.51 - 0.25 = 0.26) just clear of work_table_top's
  # far edge (-0.25 + 0.40 = 0.25): these are two separate boxes, and VAMP never checks
  # scene objects against each other, so an overlap here wouldn't affect planning -- but it
  # would render as the two slabs visibly interpenetrating in RViz.
  - {name: conveyor_belt,         role: conveyor, size: [1.80, 0.50, 0.06], xyz: [0.00, 0.51, 0.750]}
  - {name: conveyor_leg_left,     role: conveyor, size: [0.08, 0.08, 0.72], xyz: [-0.80, 0.51, 0.36]}
  - {name: conveyor_leg_right,    role: conveyor, size: [0.08, 0.08, 0.72], xyz: [0.80, 0.51, 0.36]}
  - {name: bin_left,              role: source,   size: [0.20, 0.20, 0.10], xyz: [-0.35, 0.35, 0.830]}
  - {name: bin_right,             role: source,   size: [0.20, 0.20, 0.10], xyz: [0.35, 0.35, 0.830]}
  - {name: target_box,            role: target,   size: [0.26, 0.26, 0.11], xyz: [0.00, -0.02, 0.885]}

# Drawn in RViz only. This is the 84 mm between the table top and base_link, a volume the
# robot's own base sphere already occupies, so adding it to the planner would self-collide.
display_only:
  - {name: ur5_riser,  role: riser, size: [0.18, 0.18, 0.0844], xyz: [-0.35, -0.25, 0.8722]}
  - {name: ur7e_riser, role: riser, size: [0.18, 0.18, 0.0844], xyz: [0.35, -0.25, 0.8722]}

# End-effector (gripper base) target per arm, in the world frame. 1.06/1.11 over the bin lid
# (0.88) and target rim (0.94) were sized to clear the gripper's ~0.22 m collision spheres;
# world.build() now allow-lists GRIPPER_LINKS against scene objects (see README "What the
# planner actually sees"), so these heights are more conservative than the bare arm needs --
# safe to tighten if you want the arms to dip further.
routine:
  - {name: home,        ur5: [-0.35, -0.05, 1.25], ur7e: [0.35, -0.05, 1.25]}
  - {name: over_bins,   ur5: [-0.35, 0.35, 1.16],  ur7e: [0.35, 0.35, 1.16]}
  - {name: at_bins,     ur5: [-0.35, 0.35, 1.06],  ur7e: [0.35, 0.35, 1.06]}
  - {name: lift,        ur5: [-0.35, 0.35, 1.18],  ur7e: [0.35, 0.35, 1.18]}
  - {name: over_target, ur5: [-0.13, -0.02, 1.20], ur7e: [0.13, -0.02, 1.34]}
  - {name: place,       ur5: [-0.11, -0.02, 1.11], ur7e: [0.11, -0.02, 1.28]}
  - {name: retreat,     ur5: [-0.35, -0.05, 1.25], ur7e: [0.35, -0.05, 1.25]}

# reference is both the first IK seed and the source of the tool-down orientation every
# routine target is solved with.
ik:
  reference: [1.57, -1.57, 1.57, -1.57, -1.57, 0.0]
  max_restarts: 60
  tol_pos: 0.01
  tol_ang: 0.15

planning:
  planner: composite_rrt      # composite_rrt | cbs_prm | priority_sipp_rrt
  planning_time: 10.0         # s, per leg
  shortcut_time: 0.1          # s, per leg
  vmax: 2.5                   # rad/s
  dt: 0.1                     # s between trajectory samples
  seed: 1
  roadmap_samples: 500        # cbs_prm only
  roadmap_max_dist: 2.0       # cbs_prm only

replay:
  rate: 1.0
  loop: true
